# Render Blueprint (free plan): the Django API and a PostgreSQL database.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
# Values marked "sync: false" are asked for once in the dashboard (secrets never live in git).
#
# Free-plan limits: the API sleeps after ~15 min idle (first request then takes ~1 min),
# its disk is wiped on every restart (so uploads go to object storage below), there is no
# Shell, outbound SMTP is blocked, and the free database expires after 30 days.

databases:
  - name: kakuma-db
    plan: free
    region: frankfurt
    databaseName: kakuma_resourcelink
    user: kakuma

services:
  - type: web
    name: kakuma-resourcelink-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py createcachetable &&
      exec gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 90
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kakuma-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      # Fallback only: without a bucket, uploads live on the instance and vanish when it sleeps.
      - key: SERVE_MEDIA
        value: "true"
      # The website's address once it is deployed, e.g. https://kakuma.example.org
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # AI assistant: compatible (free Google Gemini API), openai or anthropic.
      # Ollama only runs on your own machine. For Gemini: AI_PROVIDER=compatible,
      # AI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/, AI_MODEL=gemini-3.5-flash-lite
      - key: AI_PROVIDER
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Uploaded images: any S3-compatible bucket (Supabase Storage is free with no card)
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # SMTP is blocked on the free plan, so emails (password-reset codes) are printed in the Logs tab.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
