# Included wherever a location sets its own add_header (nginx does not inherit headers then).
# Scripts only from this origin (the build has no inline scripts); inline style attributes are
# used for progress bars, so styles allow 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Enable once served over HTTPS (behind a TLS-terminating proxy):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
