          description: ''
  /api/v1/notifications/:
    get:
      operationId: notifications_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: unread
        schema:
          type: boolean
      tags:
      - notifications
      security:
