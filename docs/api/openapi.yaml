        schema:
          type: integer
      tags:
      - moderation
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCommunityProjectList'
          description: ''
  /api/v1/moderation/projects/{id}/approve/:
    post:
      operationId: moderation_projects_approve_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this community project.
        required: true
      tags:
      - moderation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NoteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NoteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityProject'
          description: ''
  /api/v1/moderation/projects/{id}/reject/:
    post:
      operationId: moderation_projects_reject_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this community project.
        required: true
      tags:
      - moderation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NoteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NoteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityProject'
          description: ''
  /api/v1/moderation/reports/:
    get:
      operationId: moderation_reports_list
      description: Anyone signed in can report; only moderators can list and decide.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - dismissed
          - open
          - resolved
        description: |-
          * `open` - Open
          * `resolved` - Resolved
          * `dismissed` - Dismissed
      - in: query
        name: target_type
        schema:
          type: string
          enum:
          - comment
          - project
          - story
        description: |-
          * `story` - Story
          * `comment` - Comment
          * `project` - Community project
      tags:
      - moderation
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReportList'
          description: ''
    post:
      operationId: moderation_reports_create
      description: Anyone signed in can report; only moderators can list and decide.
      tags:
      - moderation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
          description: ''
  /api/v1/moderation/reports/{id}/decide/:
    post:
      operationId: moderation_reports_decide_create
      description: Anyone signed in can report; only moderators can list and decide.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this report.
        required: true
      tags:
      - moderation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportDecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReportDecisionRequest'
          multipart/form-data:
            schema:
