        required: true
      tags:
      - moderation
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryDetail'
          description: ''
  /api/v1/moderation/stories/{id}/reject/:
    post:
      operationId: moderation_stories_reject_create
      description: 'Review queue: stories waiting for approval (oldest first).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this story.
        required: true
      tags:
      - moderation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RejectRequest'
          multipart/form-data:
            schema:
