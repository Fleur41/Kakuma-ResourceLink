components:
  schemas:
    AIMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        role:
          $ref: '#/components/schemas/AIMessageRoleEnum'
        content:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - id
      - role
      - sources
    AIMessageRoleEnum:
      enum:
      - user
      - assistant
      type: string
      description: |-
        * `user` - User
        * `assistant` - Assistant
    AlumniOwn:
      type: object
      description: The owner's full view/edit form, including privacy controls.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          readOnly: true
        country:
          type: string
          maxLength: 80
        city:
          type: string
          maxLength: 80
        profession:
          type: string
          maxLength: 120
        organization:
          type: string
          maxLength: 150
        skills:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 20
        bio:
          type: string
          maxLength: 2000
        is_mentor:
          type: boolean
          description: Willing to mentor
        mentorship_areas:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 20
        willing_to_contribute:
          type: boolean
        contribution_interests:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 20
        visibility:
          $ref: '#/components/schemas/AlumniVisibilityEnum'
        show_contact_email:
          type: boolean
        show_city:
          type: boolean
        consent_given_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - consent_given_at
      - country
      - created_at
      - full_name
      - id
      - profession
      - updated_at
    AlumniOwnRequest:
      type: object
      description: The owner's full view/edit form, including privacy controls.
      properties:
        country:
          type: string
          minLength: 1
          maxLength: 80
        city:
          type: string
          maxLength: 80
        profession:
          type: string
          minLength: 1
          maxLength: 120
        organization:
          type: string
          maxLength: 150
        skills:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 20
        bio:
          type: string
          maxLength: 2000
        is_mentor:
          type: boolean
          description: Willing to mentor
        mentorship_areas:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 20
        willing_to_contribute:
          type: boolean
        contribution_interests:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 20
        visibility:
          $ref: '#/components/schemas/AlumniVisibilityEnum'
        show_contact_email:
          type: boolean
        show_city:
          type: boolean
        consent:
          type: boolean
          writeOnly: true
      required:
      - country
      - profession
    AlumniPublic:
