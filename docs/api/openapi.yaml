    StoryList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
          readOnly: true
        cover_image:
          type: string
          format: uri
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/StoryCategoryEnum'
          readOnly: true
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StoryStatusEnum'
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/PublicUser'
          readOnly: true
        reading_time:
          type: integer
          readOnly: true
        likes_count:
          type: integer
          readOnly: true
          default: 0
        comments_count:
          type: integer
          readOnly: true
          default: 0
        is_liked:
          type: boolean
          readOnly: true
          default: false
        is_bookmarked:
          type: boolean
          readOnly: true
          default: false
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - category
      - comments_count
      - cover_image
      - created_at
      - excerpt
      - id
      - is_bookmarked
      - is_liked
      - language
      - likes_count
      - published_at
      - reading_time
      - slug
      - status
      - title
      - updated_at
    StoryStatusEnum:
      enum:
      - draft
      - pending_review
      - published
      - rejected
      - archived
      type: string
      description: |-
        * `draft` - Draft
        * `pending_review` - In review
        * `published` - Published
        * `rejected` - Needs changes
        * `archived` - Archived
    TaskEnum:
      enum:
      - chat
      - explain_opportunity
      - summarize_story
      - translate
      type: string
      description: |-
        * `chat` - chat
        * `explain_opportunity` - explain_opportunity
        * `summarize_story` - summarize_story
        * `translate` - translate
    TokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    Updated:
      type: object
      properties:
        updated:
          type: integer
      required:
      - updated
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        full_name:
          type: string
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        preferred_language:
          $ref: '#/components/schemas/LanguageEnum'
        date_joined:
          type: string
          format: date-time
          readOnly: true
        profile:
          $ref: '#/components/schemas/Profile'
        has_alumni_profile:
          type: boolean
          readOnly: true
      required:
      - date_joined
      - email
      - full_name
      - has_alumni_profile
      - id
      - role
    UserRoleEnum:
      enum:
      - member
      - alumni
      - mentor
      - moderator
      - admin
      type: string
      description: |-
        * `member` - Community member
        * `alumni` - Alumni
        * `mentor` - Mentor
        * `moderator` - Moderator
        * `admin` - Administrator
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
