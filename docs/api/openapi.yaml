          type: string
          readOnly: true
        avatar:
          type: string
          format: uri
          readOnly: true
        country:
          type: string
          maxLength: 80
        city:
          type: string
          nullable: true
          readOnly: true
        profession:
          type: string
          maxLength: 120
        organization:
          type: string
          maxLength: 150
        skills: {}
        bio:
          type: string
          maxLength: 2000
        is_mentor:
          type: boolean
